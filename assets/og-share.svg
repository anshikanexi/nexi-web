  <text x="72" y="548" fill="rgba(232,213,181,.7)" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3">EARLY CIRCLE  ·  ANSHIKANEXI.GITHUB.IO/NEXI-WEB</text>
